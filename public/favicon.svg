<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>

  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="16" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="2.5" fill="#6366f1"/>

  <!-- Head -->
  <rect x="14" y="16" width="36" height="26" rx="7" fill="#1a1a1a" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Eyes -->
  <rect x="20" y="24" width="8" height="6" rx="2" fill="#6366f1"/>
  <rect x="36" y="24" width="8" height="6" rx="2" fill="#6366f1"/>

  <!-- Mouth -->
  <rect x="22" y="34" width="20" height="3" rx="1.5" fill="#374151"/>

  <!-- Body -->
  <rect x="20" y="44" width="24" height="14" rx="5" fill="#1a1a1a" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Body dots -->
  <circle cx="28" cy="51" r="2" fill="#6366f1" opacity="0.6"/>
  <circle cx="36" cy="51" r="2" fill="#6366f1" opacity="0.6"/>
</svg>